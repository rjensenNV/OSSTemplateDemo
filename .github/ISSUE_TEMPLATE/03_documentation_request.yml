name: Request documentation
description: Report missing, unclear, or incorrect project documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        The maintainer provides an initial response within seven calendar days. Resolution remains best effort.

  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the affected page or identify the file and section. Write "Missing" when requesting new documentation.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, unclear, outdated, or absent and who it affects.
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: Suggested improvement
      description: Describe the correction, example, explanation, or new content that would resolve the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same documentation problem.
          required: true
